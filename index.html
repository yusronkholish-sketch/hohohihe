:root {
  --navy: #1D3557; --navy-2: #2A4A73; --paper: #FFFBF3; --paper-edge: #EADFCB;
  --wood: #C98F55; --wood-dark: #8C5A34; --manila: #F5C766; --manila-dark: #E0A94A;
  --red: #C63A2F; --green: #2F9A5E; --green-dark: #227346; --orange: #EE7B30; --orange-dark: #C85F1A;
  --steel: #6E8A96; --steel-dark: #4F6772; --steel-face: #8FA8B2; --muted: #5E6B78; --wall: #E3ECE6;
  --ok-bg: #E6F6EC; --bad-bg: #FDECEA;
  --f-head: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --f-hand: 'Caveat', 'Comic Sans MS', cursive;
  --f-letter: Georgia, 'Times New Roman', serif;
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #16222E; overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--f-body); color: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 5px solid #F5C766; outline-offset: 4px; border-radius: 10px; }
.ico { width: 1em; height: 1em; flex: none; }

/* =========================================================
   AUDIO — semua suara dibuat dengan Web Audio API,
   jadi tidak perlu file mp3 dan tetap jalan offline.
   ========================================================= */
const Sound = (() => {
  let ctx = null, master, sfxBus, musicBus, ambBus, noiseBuf = null, brownBuf = null;
  let musicOn = true, profile = 'menu', schedTimer = null, nextBarTime = 0, bar = 0;
  let ambNode = null, typeTimer = null;

  const CHORDS = {
    menu: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]],
    focus: [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59], [45, 48, 52, 55]],
  };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = musicOn ? 0.10 : 0; musicBus.connect(master);
    ambBus = ctx.createGain(); ambBus.gain.value = 0; ambBus.connect(master);
    // white noise buffer
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // brown noise (dengung AC)
    brownBuf = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate);
    const b = brownBuf.getChannelData(0); let last = 0;
    for (let i = 0; i < b.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; b[i] = last * 3.5; }
    startMusic();
  }

  function env(g, t, a, peak, r, sustain = 0) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    if (sustain) g.gain.setValueAtTime(peak, t + a + sustain);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + sustain + r);
  }

  function tone(freq, { t = 0, dur = 0.15, type = 'sine', gain = 0.3, attack = 0.005, to = null, bus = sfxBus, filter = null } = {}) {
    if (!ctx) return;
    const now = ctx.currentTime + t;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, now);
    if (to) o.frequency.exponentialRampToValueAtTime(to, now + dur);
    const g = ctx.createGain(); env(g, now, attack, gain, dur);
    let node = o;
    if (filter) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; o.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    o.start(now); o.stop(now + attack + dur + 0.05);
  }

  function noise({ t = 0, dur = 0.1, type = 'bandpass', freq = 1000, to = null, q = 1, gain = 0.3, attack = 0.003, bus = sfxBus } = {}) {
    if (!ctx) return;
    const now = ctx.currentTime + t;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, now); f.Q.value = q;
    if (to) f.frequency.exponentialRampToValueAtTime(to, now + dur);
    const g = ctx.createGain(); env(g, now, attack, gain, dur);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(now, Math.random()); s.stop(now + attack + dur + 0.05);
  }

  const sfx = {
    click() { noise({ dur: 0.035, type: 'highpass', freq: 2500, gain: 0.35 }); tone(1900, { dur: 0.025, gain: 0.08, type: 'square', filter: 3000 }); },
    hover() { tone(880, { dur: 0.05, gain: 0.04 }); },
    paper() { noise({ dur: 0.28, freq: 900, to: 3200, q: 0.7, gain: 0.28, attack: 0.04 }); noise({ t: 0.12, dur: 0.18, freq: 2600, to: 1400, q: 0.8, gain: 0.16, attack: 0.02 }); },
    thump() { tone(110, { dur: 0.28, to: 45, gain: 0.9 }); noise({ dur: 0.07, type: 'lowpass', freq: 500, gain: 0.6 }); noise({ t: 0.01, dur: 0.05, freq: 3000, gain: 0.12 }); },
    drawerOpen() { noise({ dur: 0.38, freq: 700, to: 1800, q: 3, gain: 0.22, attack: 0.03 }); tone(2600, { t: 0.36, dur: 0.12, type: 'triangle', gain: 0.05 }); },
    drawerClose() { noise({ dur: 0.18, freq: 1600, to: 600, q: 3, gain: 0.2, attack: 0.02 }); tone(150, { t: 0.17, dur: 0.14, to: 90, gain: 0.5 }); noise({ t: 0.17, dur: 0.05, type: 'highpass', freq: 3000, gain: 0.2 }); },
    success() { [659, 784, 988].forEach((f, i) => tone(f, { t: i * 0.08, dur: 0.3, type: 'triangle', gain: 0.18 })); },
    error() { tone(233, { dur: 0.16, type: 'triangle', gain: 0.25 }); tone(196, { t: 0.14, dur: 0.24, type: 'triangle', gain: 0.25 }); },
    warn() { tone(622, { dur: 0.14, gain: 0.12 }); tone(466, { t: 0.13, dur: 0.24, gain: 0.12 }); },
    pop() { tone(520, { dur: 0.09, to: 880, gain: 0.12 }); },
    write() { for (let i = 0; i < 5; i++) noise({ t: i * 0.06, dur: 0.05, freq: 4000 + Math.random() * 1500, q: 2, gain: 0.06 }); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, { t: i * 0.11, dur: 0.35, type: 'triangle', gain: 0.2 }));
      [523, 659, 784].forEach((f) => tone(f, { t: 0.5, dur: 0.9, type: 'triangle', gain: 0.12 })); },
    softWarn() { tone(392, { dur: 0.3, gain: 0.12 }); tone(330, { t: 0.25, dur: 0.45, gain: 0.12 }); },
    chime() { [784, 1047].forEach((f, i) => tone(f, { t: i * 0.1, dur: 0.4, type: 'sine', gain: 0.14 })); },
  };

  /* ---------- musik lo-fi ---------- */
  function scheduleBar(t0) {
    const chords = CHORDS[profile] || CHORDS.menu;
    const tempo = profile === 'focus' ? 66 : 76;
    const beat = 60 / tempo; const chord = chords[bar % chords.length];
    // pad
    chord.forEach((m, i) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m); o.detune.value = (i % 2 ? 6 : -6);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.09, t0 + 0.6);
      g.gain.setValueAtTime(0.09, t0 + beat * 3.4); g.gain.linearRampToValueAtTime(0.0001, t0 + beat * 4 + 0.3);
      o.connect(f); f.connect(g); g.connect(musicBus); o.start(t0); o.stop(t0 + beat * 4 + 0.4);
    });
    // bass
    [0, 2].forEach((b) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(chord[0] - 12);
      const g = ctx.createGain(); const tt = t0 + b * beat; env(g, tt, 0.02, 0.22, beat * 1.4);
      o.connect(g); g.connect(musicBus); o.start(tt); o.stop(tt + beat * 1.6);
    });
    // hi-hat halus + kick lembut
    for (let i = 0; i < 8; i++) {
      const swing = i % 2 ? beat * 0.08 : 0; const tt = t0 + i * beat / 2 + swing;
      const s = ctx.createBufferSource(); s.buffer = noiseBuf;
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = ctx.createGain(); env(g, tt, 0.002, i % 2 ? 0.035 : 0.05, 0.05);
      s.connect(f); f.connect(g); g.connect(musicBus); s.start(tt, Math.random()); s.stop(tt + 0.1);
    }
    [0, 2.5].forEach((b) => {
      const tt = t0 + b * beat; const o = ctx.createOscillator(); o.frequency.setValueAtTime(120, tt); o.frequency.exponentialRampToValueAtTime(50, tt + 0.15);
      const g = ctx.createGain(); env(g, tt, 0.003, 0.25, 0.18); o.connect(g); g.connect(musicBus); o.start(tt); o.stop(tt + 0.25);
    });
    // melodi pendek tiap dua birama
    if (bar % 2 === 0) {
      const notes = [chord[3] + 12, chord[2] + 12, chord[1] + 12];
      notes.forEach((m, i) => tone(mtof(m), { t: (t0 - ctx.currentTime) + beat * (1 + i * 0.75), dur: 0.5, type: 'sine', gain: 0.05, bus: musicBus }));
    }
    bar++;
    return beat * 4;
  }

  function startMusic() {
    if (!ctx || schedTimer) return;
    nextBarTime = ctx.currentTime + 0.1;
    schedTimer = setInterval(() => {
      while (nextBarTime < ctx.currentTime + 1.2) nextBarTime += scheduleBar(nextBarTime);
    }, 250);
  }

  function setMusic(on) {
    musicOn = on;
    if (!ctx) return;
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.linearRampToValueAtTime(on ? 0.10 : 0, ctx.currentTime + 0.4);
    ambBus.gain.linearRampToValueAtTime(on && ambNode ? 0.05 : 0, ctx.currentTime + 0.4);
  }

  function setProfile(p) { profile = p; }

  /* ---------- ambience kantor (dengung AC + mesin tik sayup) ---------- */
  function ambience(on) {
    if (!ctx) return;
    if (on && !ambNode) {
      ambNode = ctx.createBufferSource(); ambNode.buffer = brownBuf; ambNode.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
      ambNode.connect(f); f.connect(ambBus); ambNode.start();
      ambBus.gain.linearRampToValueAtTime(musicOn ? 0.05 : 0, ctx.currentTime + 1);
      const typeBurst = () => {
        if (!ambNode) return;
        if (musicOn) { const n = 4 + Math.floor(Math.random() * 6); for (let i = 0; i < n; i++) noise({ t: i * (0.09 + Math.random() * 0.06), dur: 0.03, type: 'highpass', freq: 2200, gain: 0.25, bus: ambBus }); }
        typeTimer = setTimeout(typeBurst, 7000 + Math.random() * 9000);
      };
      typeTimer = setTimeout(typeBurst, 4000);
    } else if (!on && ambNode) {
      ambBus.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
      const n = ambNode; ambNode = null; clearTimeout(typeTimer);
      setTimeout(() => { try { n.stop(); } catch (e) {} }, 600);
    }
  }

  function play(name) { if (!ctx) return; try { sfx[name] && sfx[name](); } catch (e) {} }

  return { init, play, setMusic, setProfile, ambience, get musicOn() { return musicOn; }, set musicOnInitial(v) { musicOn = v; } };
})();

const W = 1920, H = 1080;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const fmtTime = (s) => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;

const Store = {
  key: 'labmaya-suratmasuk-v1', d: {},
  load() { try { this.d = JSON.parse(localStorage.getItem(this.key) || '{}') || {}; } catch (e) { this.d = {}; } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) {} },
  get(k, def) { return this.d[k] === undefined ? def : this.d[k]; },
  set(k, v) { this.d[k] = v; this.save(); },
  reset() { this.d = { musicOn: this.d.musicOn }; this.save(); },
};

let stage, SCALE = 1;
function fit() { SCALE = Math.min(innerWidth / W, innerHeight / H); stage.style.setProperty('--s', SCALE); }
function toStage(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE }; }

function animateIn(node, cls, delay = 0) {
  node.style.animationDelay = delay + 'ms';
  node.classList.add(cls);
  node.addEventListener('animationend', function done(ev) { if (ev.target !== node) return; node.classList.remove(cls); node.style.animationDelay = ''; node.removeEventListener('animationend', done); });
}

/* ---------- scene manager ---------- */
const Scenes = {}; let current = null; let busy = false;
async function go(name, opts = {}) {
  if (busy) return; busy = true;
  const fader = $('#fader');
  try {
    if (opts.slow) fader.classList.add('slow');
    fader.classList.add('on');
    await sleep(opts.slow ? 1150 : 280);
    closeModal();
    if (current) { Scenes[current].leave && Scenes[current].leave(); Scenes[current].el.classList.remove('active'); }
    current = name;
    const S = Scenes[name];
    S.el.classList.add('active');
    await S.enter(opts);
  } finally {
    fader.classList.remove('on'); fader.classList.remove('slow'); busy = false;
  }
}

/* ---------- modal, dialog, toast ---------- */
let modalCloseable = true, modalOnClose = null;
function openModal(node, { closeable = true, onClose = null } = {}) {
  const back = $('#modal-back'); back.innerHTML = ''; back.appendChild(node); back.classList.add('show');
  modalCloseable = closeable; modalOnClose = onClose;
  const f = node.querySelector('[data-autofocus]') || node.querySelector('button:not(:disabled), input');
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 60);
}
function closeModal() {
  const back = $('#modal-back'); if (!back.classList.contains('show')) return;
  back.classList.remove('show'); back.innerHTML = '';
  const cb = modalOnClose; modalOnClose = null; cb && cb();
}
function dialog({ title, body, buttons, width = 980 }) {
  return new Promise((res) => {
    const m = el(`<div class="modal" role="dialog" aria-modal="true" style="width:${width}px"><h2>${title}</h2><div class="dlg-body">${body}</div><div class="row"></div></div>`);
    const row = $('.row', m);
    buttons.forEach((b, i) => {
      const btn = el(`<button class="btn ${b.cls || ''}" ${i === buttons.length - 1 ? 'data-autofocus' : ''}>${b.icon ? icon(b.icon) : ''}${b.label}</button>`);
      btn.onclick = () => { modalOnClose = null; closeModal(); res(b.value); };
      row.appendChild(btn);
    });
    openModal(m, { onClose: () => res(null) });
  });
}
let toastTimer;
function toast(msg, kind = 'ok', ms = 2800) {
  const t = $('#toast'); t.className = 'toast ' + kind;
  t.innerHTML = icon(kind === 'ok' ? 'check' : kind === 'no' ? 'x' : 'info') + `<span>${msg}</span>`;
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- maskot bicara ---------- */
function say(bubble, mascot, html) {
  if (!bubble) return;
  bubble.innerHTML = html;
  bubble.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
  if (mascot) {
    mascot.classList.add('talk'); clearTimeout(mascot._t);
    const len = html.replace(/<[^>]+>/g, '').length;
    mascot._t = setTimeout(() => mascot.classList.remove('talk'), Math.min(4200, 600 + len * 32));
  }
}

function toggleFull() {
  const d = document;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) { const e = d.documentElement; (e.requestFullscreen || e.webkitRequestFullscreen || (() => {})).call(e); }
  else (d.exitFullscreen || d.webkitExitFullscreen || (() => {})).call(d);
}
function updateClocks() {
  const n = new Date(); const m = n.getMinutes(), h = n.getHours() % 12 + m / 60;
  $$('.clock-h').forEach((g) => g.setAttribute('transform', `rotate(${h * 30})`));
  $$('.clock-m').forEach((g) => g.setAttribute('transform', `rotate(${m * 6})`));
}

function askIdentity({ required = false } = {}) {
  return new Promise((res) => {
    const m = el(`<div class="modal" role="dialog" aria-modal="true" style="width:900px"><h2>Isi identitasmu dulu</h2>
      <p>Namamu akan muncul di lembar hasil yang bisa dicetak untuk guru.</p>
      <div class="field"><label for="idn">Nama lengkap</label><input id="idn" maxlength="40" value="${escHTML(Store.get('nama', ''))}" data-autofocus></div>
      <div class="field"><label for="idk">Kelas</label><input id="idk" maxlength="20" placeholder="contoh: X MPLB 1" value="${escHTML(Store.get('kelas', ''))}"></div>
      <div class="row">${required ? '' : '<button class="btn btn-light js-skip">Lewati</button>'}<button class="btn btn-green js-ok">${icon('check')}Simpan</button></div></div>`);
    const ok = () => {
      const n = $('#idn', m).value.trim(), k = $('#idk', m).value.trim();
      if (!n) { $('#idn', m).focus(); $('#idn', m).style.borderColor = 'var(--red)'; return; }
      Store.set('nama', n); Store.set('kelas', k); modalOnClose = null; closeModal(); res(true);
    };
    $('.js-ok', m).onclick = ok;
    m.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); });
    const sk = $('.js-skip', m); if (sk) sk.onclick = () => { modalOnClose = null; closeModal(); res(false); };
    openModal(m, { onClose: () => res(false) });
  });
}

    this.el.addEventListener('click', () => {
      if (!this.el.classList.contains('ready')) return;
      Sound.init(); Sound.setMusic(Store.get('musicOn', true)); Sound.play('click');
      go('home');

  },

    tip: 'Di <b>Lab Simulasi</b> kamu praktik langsung: baca kop, cap, catat, lalu arsipkan 5 surat.' },

    tip: '<b>Evaluasi Akhir</b> berisi 10 soal acak. Kumpulkan nilai minimal 80 untuk lulus.' },
];
function folderStatus(k) {
  if (k === 'story') return Store.get('storyDone') ? [true, 'check', 'Sudah ditonton'] : [false, 'play', 'Tonton dulu'];
  if (k === 'materi') return Store.get('materiDone') ? [true, 'check', 'Sudah dipelajari'] : [false, 'book', 'Belum dipelajari'];
  if (k === 'lab') { const b = Store.get('labBest'); return b == null ? [false, 'stamp', 'Belum dicoba'] : [b >= CONFIG.targetAkurasi, 'target', `Akurasi terbaik ${b}%`]; }
  const b = Store.get('evalBest'); return b == null ? [false, 'target', 'Belum dikerjakan'] : [!!Store.get('evalPassed'), 'star', `Nilai terbaik ${b}`];
}

async function startLabFlow() {
  if (!Store.get('materiDone')) {
    const v = await dialog({ title: 'Materi belum dipelajari', body: '<p>Arsi menyarankan kamu mempelajari <b>Materi</b> dulu, terutama aturan mengindeks nama. Kamu tetap boleh langsung mencoba simulasi.</p>',
      buttons: [{ label: 'Pelajari Materi', value: 'materi', cls: 'btn-light', icon: 'book' }, { label: 'Tetap mulai', value: 'lab', cls: 'btn-orange', icon: 'play' }] });
    if (v === 'materi') return go('materi');
    if (v !== 'lab') return;
  }
  if (!Store.get('nama')) await askIdentity();
  go('panduan');
}
async function startEvalFlow() {
  if (!Store.get('labDone')) {
    const v = await dialog({ title: 'Belum mencapai target lab', body: `<p>Disarankan mencapai akurasi minimal ${CONFIG.targetAkurasi}% di Lab Simulasi sebelum Evaluasi Akhir.</p>`,
      buttons: [{ label: 'Ke Lab Simulasi', value: 'lab', cls: 'btn-light', icon: 'stamp' }, { label: 'Tetap kerjakan', value: 'eval', cls: 'btn-orange', icon: 'play' }] });
    if (v === 'lab') return startLabFlow();
    if (v !== 'eval') return;
  }
  go('evaluasi');
}

Scenes.story = {
  el: null, i: 0,
  build() {
    this.el = el(`<section class="scene" id="story" aria-label="Studi kasus">${plainBG()}
      ${topbarHTML('Studi Kasus: Surat yang Hilang', { badge: 'Adegan 1 dari 4' })}
      <div class="js-body"></div></section>`);
    $('.js-back', this.el).onclick = () => go('home');
  },
  renderPanel() {
    const s = STORY[this.i];
    $('.js-badge', this.el).textContent = `Adegan ${this.i + 1} dari ${STORY.length}`;
    $('.js-body', this.el).innerHTML = `<div class="sheet story-frame"><div class="story-art">${storyArt(s.art)}</div>
      <div class="story-cap"><div class="num">${this.i + 1}</div><div><h2>${s.title}</h2><p>${s.text}</p></div></div></div>
      <div class="story-nav"><button class="btn btn-light js-prev" ${this.i ? '' : 'disabled'}>${icon('left')}Sebelumnya</button>
      <div class="dots">${STORY.map((_, k) => `<i class="${k === this.i ? 'on' : ''}"></i>`).join('')}</div>
      <button class="btn btn-orange js-next">${this.i < STORY.length - 1 ? 'Lanjut' : 'Refleksi'}${icon('right')}</button></div>`;
    $('.js-prev', this.el).onclick = () => { this.i--; Sound.play('paper'); this.renderPanel(); };
    $('.js-next', this.el).onclick = () => { Sound.play('paper'); if (this.i < STORY.length - 1) { this.i++; this.renderPanel(); } else this.renderQuiz(); };
  },
  renderQuiz() {
    $('.js-badge', this.el).textContent = 'Refleksi';
    const sel = new Set();
    const body = $('.js-body', this.el);
    body.innerHTML = `<div class="sheet story-quiz pop-in"><h2>${STORY_QUESTION.q}</h2>
      <div class="check-list">${STORY_QUESTION.options.map((o, k) => `<button class="check-opt" data-k="${k}"><span class="box">${icon('check')}</span>${o.t}</button>`).join('')}</div>
      <div class="js-fb"></div><div class="row" style="display:flex;justify-content:flex-end;gap:20px;margin-top:22px"><button class="btn btn-green js-check" disabled>${icon('check')}Periksa jawaban</button></div></div>`;
    $$('.check-opt', body).forEach((b) => b.onclick = () => {
      if (b.disabled) return; const k = +b.dataset.k;
      sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle('sel', sel.has(k));
      $('.js-check', body).disabled = sel.size === 0;
    });
    $('.js-check', body).onclick = () => {
      let right = true;
      $$('.check-opt', body).forEach((b) => {
        const k = +b.dataset.k, ok = STORY_QUESTION.options[k].ok; b.disabled = true;
        if (sel.has(k) && ok) b.classList.add('good'); else if (sel.has(k) && !ok) { b.classList.add('bad'); right = false; } else if (!sel.has(k) && ok) { b.classList.add('miss'); b.insertAdjacentHTML('beforeend', '<span class="miss-tag">seharusnya dipilih</span>'); right = false; }
      });
      Sound.play(right ? 'success' : 'warn');
      $('.js-fb', body).innerHTML = `<div class="explain"><b>${right ? 'Tepat sekali!' : 'Hampir tepat.'}</b> ${STORY_QUESTION.why}</div>`;
      Store.set('storyDone', true);
      const row = $('.row', body); row.innerHTML = `<button class="btn btn-light js-home">${icon('home')}Beranda</button><button class="btn btn-orange js-materi">${icon('book')}Pelajari Materi</button>`;
      $('.js-home', row).onclick = () => go('home'); $('.js-materi', row).onclick = () => go('materi');
    };
  },
  async enter() { this.i = 0; this.renderPanel(); },
};

Scenes.materi = {
  el: null, page: 0, seen: null, quiz: null,
  build() {
    this.el = el(`<section class="scene" id="materi" aria-label="Materi">${plainBG()}
      ${topbarHTML('Materi: Dasar Penanganan Dokumen', { badge: 'Langkah 1 dari 6' })}
      <nav class="mat-side" aria-label="Daftar materi"></nav><article class="sheet mat-main"></article>
      <div class="mat-foot"><button class="btn btn-light js-prev">${icon('left')}Kembali</button><div class="hint-line js-hint"></div><button class="btn btn-orange js-next">Lanjut${icon('right')}</button></div></section>`);
    $('.js-back', this.el).onclick = () => go('home');
    $('.js-prev', this.el).onclick = () => { if (this.page === 0) return go('home'); this.show(this.page - 1); };
    $('.js-next', this.el).onclick = () => { if (this.page < MATERI_PAGES.length - 1) this.show(this.page + 1); else startLabFlow(); };
  },
  renderSide() {
    $('.mat-side', this.el).innerHTML = MATERI_PAGES.map((t, i) => `<button class="mat-step ${i === this.page ? 'on' : ''} ${this.seen.has(i) && i !== this.page ? 'seen' : ''}" data-i="${i}"><span class="n">${this.seen.has(i) && i !== this.page ? icon('check') : i + 1}</span>${t}</button>`).join('');
    $$('.mat-step', this.el).forEach((b) => b.onclick = () => this.show(+b.dataset.i));
  },
  show(i) {
    this.page = i; this.seen.add(i); Sound.play('paper');
    $('.js-badge', this.el).textContent = `Langkah ${i + 1} dari ${MATERI_PAGES.length}`;
    this.renderSide();
    const main = $('.mat-main', this.el); main.innerHTML = ''; main.scrollTop = 0;
    const nx = $('.js-next', this.el); nx.style.visibility = 'visible';
    nx.innerHTML = i < MATERI_PAGES.length - 1 ? `Lanjut${icon('right')}` : `${icon('stamp')}Ke Lab Simulasi`;
    $('.js-prev', this.el).innerHTML = i === 0 ? `${icon('home')}Beranda` : `${icon('left')}Kembali`;
    $('.js-hint', this.el).innerHTML = '';
    [this.pCycle, this.pKinds, this.pFlow, this.pRules, this.pTry, this.pQuiz][i].call(this, main);
    main.firstElementChild && main.firstElementChild.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'ease-out' });
  },
  pCycle(main) {
    const R = 190, C = 260;
    const pos = CYCLE.map((_, i) => { const a = (-90 + i * 72) * Math.PI / 180; return [C + R * Math.cos(a), C + R * Math.sin(a)]; });
    const arrows = CYCLE.map((_, i) => { const deg = -90 + i * 72 + 36, a = deg * Math.PI / 180; const x = C + R * Math.cos(a), y = C + R * Math.sin(a);
      return `<path d="M-12 -12 L12 0 L-12 12 Z" fill="#1D3557" transform="translate(${x} ${y}) rotate(${deg + 90})"/>`; }).join('');
    main.innerHTML = `<div><h2>Siklus hidup arsip</h2><p class="lead">Setiap dokumen, termasuk surat masuk, melewati tahap-tahap sejak pertama kali ada hingga akhirnya disimpan permanen atau dimusnahkan. <b>Klik setiap tahap</b> pada roda.</p>
      <div class="cycle"><div class="cyc-wheel"><svg class="ring" viewBox="0 0 520 520"><circle cx="260" cy="260" r="190" fill="none" stroke="#9FB3C8" stroke-width="10" stroke-dasharray="4 16" stroke-linecap="round"/>${arrows}</svg>
      <div class="cyc-center">Siklus Hidup Arsip</div>
      ${CYCLE.map((c, i) => `<button class="cyc-node" data-i="${i}" style="left:${pos[i][0]}px;top:${pos[i][1]}px">${icon(c.icon)}${c.k}</button>`).join('')}</div>
      <div class="cyc-detail"></div></div></div>`;
    const seen = new Set();
    const pick = (i) => {
      seen.add(i); $$('.cyc-node', main).forEach((n) => { n.classList.toggle('on', +n.dataset.i === i); n.classList.toggle('seen', seen.has(+n.dataset.i)); });
      const c = CYCLE[i];
      $('.cyc-detail', main).innerHTML = `<div class="step-no">Tahap ${i + 1} dari 5</div><h3>${c.k}</h3><p>${c.d}</p><div class="ex"><b>Contoh:</b> ${c.c}</div>`;
      $('.js-hint', this.el).innerHTML = `${icon('eye')} ${seen.size} dari 5 tahap sudah dibaca`;
    };
    $$('.cyc-node', main).forEach((n) => n.onclick = () => { Sound.play('pop'); pick(+n.dataset.i); });
    pick(0);
  },
  pKinds(main) {
    main.innerHTML = `<div><h2>Jenis dan nilai guna arsip</h2><p class="lead">Mengenali jenis dan nilai guna dokumen membantu kita memutuskan cara menyimpan dan berapa lama menyimpannya.</p>
      <div class="two-col"><div>
        <div class="kind-card"><h4>Arsip dinamis</h4><p>Dipakai langsung dalam kegiatan kantor dan disimpan untuk jangka waktu tertentu.</p><span class="tagline">Aktif: sering dipakai</span> <span class="tagline">Inaktif: jarang dipakai</span></div>
        <div class="kind-card"><h4>Arsip statis</h4><p>Bernilai guna kesejarahan, masa retensinya sudah habis, dan disimpan permanen oleh lembaga kearsipan.</p></div>
        <div class="kind-card"><h4>Sifat surat (untuk menyortir)</h4><p>Surat masuk dipisahkan menurut sifatnya sebelum diproses.</p>
          <div class="sifat"><span style="background:#C63A2F">Rahasia</span><span style="background:#E58A3A">Penting</span><span style="background:#6E8A96">Biasa</span></div></div>

        <div class="alfred">${ALFRED.map((a, i) => `<button class="flip" data-i="${i}" aria-label="${a.k}"><span class="flip-in"><span class="flip-f"><b>${a.h}</b><span>${a.k}</span></span>

const STEP_NAMES = ['Baca kop', 'Cap', 'Catat', 'Arsipkan'];

function drag(node, { onStart, onMove, onEnd, onClick, threshold = 8 }) {
  node.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const s = { x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
    const move = (ev) => {
      if (ev.pointerId !== s.id) return;
      if (!s.on) { if (Math.hypot(ev.clientX - s.x, ev.clientY - s.y) < threshold) return; s.on = onStart ? onStart(ev) !== false : true; if (!s.on) { clean(); return; } }
      onMove && onMove(ev);
    };
    const up = (ev) => { if (ev.pointerId !== s.id) return; clean(); if (s.on) onEnd && onEnd(ev); else if (ev.type === 'pointerup') onClick && onClick(ev); };
    const clean = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  node.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick && onClick(e); } });
}

function prepareLetters(n) {
  const by = (g) => shuffle(LETTERS.filter((l) => l.group === g));
  const plan = n === 5 ? [...by('usaha').slice(0, 2), by('pemda')[0], by('lembaga')[0], by('orang')[0]] : shuffle(LETTERS).slice(0, n);
  const today = new Date();
  return shuffle(plan).map((L) => {
    const d = new Date(today); d.setDate(d.getDate() - rand(2, 7));
    const nomor = L.person ? '' : `${pad(rand(11, 480), 3)}/${L.code}/${ROMAWI[d.getMonth()]}/${d.getFullYear()}`;
    return { ...L, dateObj: d, nomor };
  });
}

function computeIndeks(L, k) {
  if (k === L.kt) return L.indeks;
  if (k === 0) return L.words.join(' ');
  return `${L.words[k]}, ${L.words.filter((_, i) => i !== k).join(' ')}`;
}
const codeOf = (w) => w.replace(/[^A-Za-z]/g, '').charAt(0).toUpperCase();

    else tray.appendChild(el(`<span class="tray-empty">Baki kosong</span>`));
  },

  buildLetter() {

  },
  codeTagHTML() { return this.st.fixed ? `<small>Kode laci</small><b><s style="opacity:.5;font-size:40px">${this.st.code}</s> ${this.cur.laci}</b>` : `<small>Kode laci</small><b>${this.st.code}</b>`; },

  pickLetter() {

  },

  /* ---------- langkah 1: membaca ---------- */
  openReader() {
    const reading = this.phase === 'read';
    const L = this.cur;
    const m = el(`<div class="modal reader" role="dialog" aria-modal="true" aria-label="Membaca surat"><div class="r-letter ${reading ? 'reading' : ''}"></div>

    const meta = $('.r-meta', m);
    const fillMeta = () => { meta.innerHTML = `<dt>Pengirim</dt><dd>${escHTML(L.sender)}</dd>${L.nomor ? `<dt>Nomor</dt><dd>${escHTML(L.nomor)}</dd>` : ''}<dt>Tanggal</dt><dd>${fmtTanggal(L.dateObj)}</dd><dt>Hal</dt><dd>${escHTML(L.hal)}</dd>`; meta.style.display = 'grid'; };
    if (!reading) { fillMeta(); $$('.sender', letter).forEach((s) => s.classList.add('mark-ok')); }
    const WHY = {

      date: 'Itu <b>tempat dan tanggal</b> surat dibuat.',

          fillMeta(); Sound.play('success'); $('.js-close', m).disabled = false; $('.js-close', m).focus();
        } else {
          h.classList.add('mark-no'); setTimeout(() => h.classList.remove('mark-no'), 900);
          fb.className = 'r-fb show no'; fb.innerHTML = WHY[part] || 'Bukan bagian itu. Coba perhatikan kop surat.'; Sound.play('error');
          fb.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 250 });
        }
      }));

    $('.js-close', m).onclick = () => { closeModal(); };

      Sound.play('paper');

    } });
  },

  /* ---------- langkah 2: stempel ---------- */
  setupStamp() {
    const tool = $('.stamp-tool', this.el); let ghost = null;
    drag(tool, {
      onStart: (ev) => {
        ghost = el(`<div class="ghost stampg">${stampToolSVG()}</div>`); stage.appendChild(ghost); tool.classList.add('dragging');
        const p = toStage(ev); ghost.style.transform = `translate(${p.x}px, ${p.y}px)`;
      },
      onMove: (ev) => { const p = toStage(ev); ghost.style.transform = `translate(${p.x}px, ${p.y}px)`; },
      onEnd: (ev) => {
        const ml = $('.mat-letter', this.el); let pt = null;
        if (ml) { const r = ml.getBoundingClientRect(); if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) pt = { x: (ev.clientX - r.left) / r.width * 680, y: (ev.clientY - r.top) / r.height * 940 }; }
        const g = ghost; ghost = null;
        if (pt) { this.doStamp(pt, g, () => tool.classList.remove('dragging')); }
        else {
          g.remove(); tool.classList.remove('dragging');
          if (ml && this.phase === 'stamp') toast('Letakkan stempel tepat di atas surat.', 'warn', 2200);
        }
      },
      onClick: () => this.doStamp(null, null),
    });
  },
  doStamp(pt, ghost, done) {
    const finish = () => { ghost && ghost.remove(); done && done(); };
    if (this.phase === 'pick') { finish(); toast('Ambil surat dari baki Surat Masuk dulu.', 'warn'); return; }
    if (this.st.stamp) { finish(); toast('Surat ini sudah dicap DITERIMA.', 'warn'); return; }
    if (this.phase !== 'stamp') { finish(); return; }
    const x = pt ? Math.min(530, Math.max(150, pt.x)) : 470, y = pt ? Math.min(860, Math.max(90, pt.y)) : 330;
    const rot = rand(-8, 4);
    const land = () => {
      Sound.play('thump');
      this.st.stamp = { x, y, rot };
      const ml = $('.mat-letter', this.el);
      const s = el(stampImpressionHTML(fmtDDMM(new Date()), '', rot)); s.classList.add('new'); s.style.left = x + 'px'; s.style.top = y + 'px';
      $('.stamp-layer', ml).appendChild(s);
      ml.animate([{ transform: 'scale(.42) translateY(0)' }, { transform: 'scale(.42) translateY(8px)' }, { transform: 'scale(.42)' }], { duration: 200 });
      this.phase = 'agenda'; this.updateUI(); this.tip();
    };
    if (ghost) {
      const cur = ghost.style.transform;
      ghost.animate([{ transform: cur }, { transform: cur + ' translateY(30px) scale(.92)' }, { transform: cur }], { duration: 260, easing: 'ease-in-out' });
      setTimeout(land, 110); setTimeout(finish, 280);
    } else {
      const tool = $('.stamp-tool', this.el);
      tool.animate([{ transform: 'none' }, { transform: 'translate(-360px, 40px) rotate(-8deg)' }, { transform: 'translate(-360px, 70px) scale(.94)' }, { transform: 'none' }], { duration: 650, easing: 'ease-in-out' });
      setTimeout(land, 380);
    }
  },

  /* ---------- langkah 3: buku agenda ---------- */
  setupAgenda() {
    $('.agenda-book', this.el).onclick = () => {
      if (this.phase === 'pick' || this.phase === 'read') return toast('Ambil dan baca surat terlebih dulu.', 'warn');
      if (this.phase === 'stamp') return this.procError('Surat belum dicap DITERIMA. Bubuhkan cap dulu sebelum mencatat di buku agenda.');
      if (this.phase !== 'agenda') return toast('Surat ini sudah dicatat di buku agenda.', 'warn');
      this.openAgenda();
    };
  },
  openAgenda() {
    const L = this.cur, Y = new Date().getFullYear();
    const no = pad(this.agendaBase + this.idx + 1, 3);
    const past = this.stats.slice(-3).map((s) => `<tr class="past"><td class="hand">${s.agendaNo}</td><td>${fmtDDMM(new Date())}</td><td>${escHTML(s.nomor || '-')}</td><td>${escHTML(s.sender)}</td><td>${escHTML(s.hal)}</td><td class="hand">${escHTML(s.code)}</td></tr>`).join('');
    const m = el(`<div class="modal agenda" role="dialog" aria-modal="true" aria-label="Buku agenda"><div class="ag-head">${icon('book')}<h2>Buku Agenda Surat Masuk ${Y}</h2><div class="spacer"></div><button class="btn btn-sm btn-light js-x">${icon('x')}Tutup</button></div>
      <div class="ag-body"><table class="ag-table"><thead><tr><th style="width:120px">No. Agenda</th><th style="width:160px">Tgl Terima</th><th style="width:300px">No. dan Tgl Surat</th><th>Pengirim</th><th>Perihal</th><th style="width:250px">Indeks / Kode</th></tr></thead>
        <tbody>${past}<tr class="cur"><td class="hand f0"></td><td class="hand f1"></td><td class="hand f2"></td><td class="hand f3"></td><td class="hand f4"></td><td class="hand f5">?</td></tr></tbody></table>
        <div class="ag-pick"><div class="left"><h3>Tentukan kata tangkap</h3><p>Klik kata yang menjadi <b>unit pertama</b> indeks untuk pengirim <b>${escHTML(L.sender)}</b>.</p>
          <div class="ag-chips">${L.words.map((w, k) => `<button class="chip" data-k="${k}" disabled>${escHTML(w)}</button>`).join('')}</div></div>
          <div class="ag-result"><div>Indeks yang akan ditulis</div><div class="big">&hellip;</div><div class="code">Kode laci <b>?</b></div></div></div>
        <div class="row" style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn btn-green js-save" disabled>${icon('pen')}Simpan dan tulis kode di surat</button></div></div></div>`);
    const vals = [no, fmtDDMM(new Date()), `${L.nomor ? L.nomor + ', ' : ''}${fmtDDMM(L.dateObj)}`, L.sender, L.hal];
    let choice = null, alive = true;
    (async () => {
      for (let i = 0; i < vals.length; i++) {
        const td = $('.f' + i, m); td.classList.add('typing'); Sound.play('write');
        for (let c = 1; c <= vals[i].length; c += 3) { if (!alive) return; td.textContent = vals[i].slice(0, c); await sleep(14); }
        td.textContent = vals[i]; td.classList.remove('typing');
      }
      $$('.chip', m).forEach((c) => { c.disabled = false; });
      $('.chip', m) && $('.chip', m).focus();
    })();
    $$('.chip', m).forEach((c) => c.onclick = () => {
      choice = +c.dataset.k; Sound.play('pop');
      $$('.chip', m).forEach((x) => x.classList.toggle('sel', x === c));
      const ind = computeIndeks(L, choice), code = codeOf(L.words[choice]);
      $('.big', m).textContent = ind; $('.code b', m).textContent = code; $('.f5', m).textContent = `${ind} / ${code}`;
      $('.js-save', m).disabled = false;
    });
    $('.js-save', m).onclick = () => {
      this.st.ktWord = L.words[choice]; this.st.ktOK = choice === L.kt; this.st.code = codeOf(L.words[choice]); this.st.agendaNo = no;
      this.st.hal = L.hal; this.st.nomor = L.nomor; this.st.chosenIndeks = computeIndeks(L, choice);
      Sound.play('write'); this.phase = 'file';
      modalOnClose = null; closeModal(); alive = false;
      this.refreshMatLetter();
      const ml = $('.mat-letter', this.el); const tag = $('.code-tag', ml); tag.style.animation = ''; animateIn(tag, 'pop-in', 0);
      this.updateUI(); this.tip();
    };
    $('.js-x', m).onclick = () => closeModal();
    openModal(m, { onClose: () => { alive = false; } });
  },

  /* ---------- langkah 4: arsip ---------- */
  setupLetterDrag(ml) {
    let ghost = null, hot = null;
    const findDrawer = (ev) => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t && t.closest ? t.closest('.drawer:not(.blank)') : null; };
    drag(ml, {
      onStart: (ev) => {
        if (this.phase === 'pick' || this.phase === 'read') return false;
        ghost = el(`<div class="ghost letterg"></div>`); ghost.appendChild(this.buildLetter()); stage.appendChild(ghost);
        ml.classList.add('dragging'); this.selected = false; ml.classList.remove('selected');
        const p = toStage(ev); ghost.style.transform = `translate(${p.x - 95}px, ${p.y - 40}px) scale(.28) rotate(-4deg)`;
        Sound.play('paper');
      },
      onMove: (ev) => {
        const p = toStage(ev); ghost.style.transform = `translate(${p.x - 95}px, ${p.y - 40}px) scale(.28) rotate(-4deg)`;
        const d = findDrawer(ev); if (d !== hot) { hot && hot.classList.remove('hot'); hot = d; hot && hot.classList.add('hot'); }
      },
      onEnd: (ev) => {
        const d = findDrawer(ev); hot && hot.classList.remove('hot'); hot = null;
        if (d) this.dropOn(d.dataset.l, ghost);
        else { ghost.remove(); ml.classList.remove('dragging'); }
        ghost = null;
      },
      onClick: () => {
        if (this.phase === 'file' || this.phase === 'fixing') {
          this.selected = !this.selected; ml.classList.toggle('selected', this.selected);
          if (this.selected) { Sound.play('pop'); toast('Surat dipilih. Sekarang klik laci tujuannya.', 'warn', 2400); }
        } else if (this.phase !== 'pick') this.openReader();
      },
    });
  },
  procError(msg) {
    this.st.proc++; Sound.play('warn'); toast(msg, 'warn', 3400);
    say($('.assistant .speech', this.el), $('.assistant .mascot', this.el), `Ingat urutannya: <b>baca, cap, catat, arsipkan</b>. ${msg}`);
  },
  dropOn(l, ghost = null) {
    const ml = $('.mat-letter', this.el);
    const back = () => { ghost && ghost.remove(); ml && ml.classList.remove('dragging'); };
    const drawer = $(`.drawer[data-l="${l}"]`, this.el);
    if (this.phase === 'pick' || this.phase === 'read') { back(); return toast('Belum ada surat yang siap diarsipkan.', 'warn'); }
    if (this.phase === 'stamp') { back(); return this.procError('Surat belum dicap DITERIMA. Arsip tanpa cap tidak punya bukti tanggal terima.'); }
    if (this.phase === 'agenda') { back(); return this.procError('Surat belum dicatat di buku agenda. Surat yang tidak tercatat sulit dilacak.'); }
    if (this.phase !== 'file' && this.phase !== 'fixing') { back(); return; }
    const L = this.cur;
    if (this.phase === 'file') { this.st.firstDrawer = l; this.st.arsipOK = l === L.laci; }
    if (l === L.laci) return this.fileSuccess(drawer, ghost);
    // keliru
    back(); Sound.play('error');
    drawer.classList.remove('shake'); void drawer.offsetWidth; drawer.classList.add('shake'); setTimeout(() => drawer.classList.remove('shake'), 500);
    if (this.phase === 'fixing') return toast(`Bukan laci ${l}. Masukkan ke laci yang menyala hijau.`, 'no');
    this.phase = 'fixing'; this.updateUI();
    $(`.drawer[data-l="${L.laci}"]`, this.el).classList.add('target');
    this.st.fixed = true; this.refreshMatLetter();
    const ktNote = this.st.ktOK ? `Kata tangkapmu di buku agenda sudah benar (<b>${escHTML(this.st.ktWord)}</b>), tetapi surat masuk ke laci yang berbeda dari kodenya.`
      : `Di buku agenda kamu memilih <b>${escHTML(this.st.ktWord)}</b> sebagai kata tangkap.`;
    dialog({ title: `Keliru, bukan laci ${l}`, width: 1100,
      body: `<p>Surat dari <b>${escHTML(L.sender)}</b> seharusnya diindeks <b>${escHTML(L.indeks)}</b>, jadi disimpan di <b>laci ${L.laci}</b>.</p>
        <p style="background:#FFF7E3;border-radius:14px;padding:14px 18px;font-size:25px"><b>Aturan ${RULES[L.rule].nama.toLowerCase()}:</b> ${RULES[L.rule].teks}</p><p style="font-size:24px">${ktNote}</p>`,
      buttons: [{ label: `Pindahkan ke laci ${L.laci}`, value: 1, cls: 'btn-green', icon: 'drawer' }] }).then(() => this.tip());
  },
  fileSuccess(drawer, ghost) {
    const ml = $('.mat-letter', this.el); const L = this.cur; const first = this.phase === 'file';
    this.phase = 'done'; this.selected = false;
    drawer.classList.remove('target'); drawer.classList.add('open'); Sound.play('drawerOpen');
    if (!ghost) { ghost = el(`<div class="ghost letterg"></div>`); ghost.appendChild(this.buildLetter()); stage.appendChild(ghost); ghost.style.transform = `translate(860px, 640px) scale(.3)`; }
    ml && ml.remove();
    const r = drawer.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const tx = (r.left - sr.left) / SCALE + r.width / SCALE / 2 - 20, ty = (r.top - sr.top) / SCALE + 10;
    ghost.classList.add('flyin'); void ghost.offsetWidth;
    ghost.style.transform = `translate(${tx}px, ${ty}px) scale(.06)`; ghost.style.opacity = '0.2';
    const f = $('.fill', drawer); f.textContent = +f.textContent + 1; drawer.classList.add('has');
    this.stats.push({ ...this.st, sender: L.sender, hal: L.hal, nomor: L.nomor });
    if (first) { Sound.play('success'); toast(`Tepat! <b>${escHTML(L.indeks)}</b> tersimpan di laci ${L.laci}.`, 'ok'); }
    else toast(`Surat sudah dipindahkan ke laci ${L.laci}.`, 'ok');
    this.updateUI();
    setTimeout(() => { ghost.remove(); drawer.classList.remove('open'); Sound.play('drawerClose'); }, 620);
    setTimeout(() => { this.idx++; this.nextLetter(); }, 1300);
  },

  /* ---------- UI ---------- */
  updateUI() {
    const step = PHASE_STEP[this.phase];
    $$('.lab-step', this.el).forEach((s, i) => { s.classList.toggle('on', i === step); s.classList.toggle('done', i < step); });
    $$('.poster li', this.el).forEach((s, i) => { s.classList.toggle('on', i === step); s.classList.toggle('done', i < step); });
    const n = this.letters.length, doneCount = this.stats.length;

    $('.ldots', this.el).innerHTML = this.letters.map((_, i) => { const s = this.stats[i]; return `<i class="${s ? (s.arsipOK ? 'ok' : 'no') : i === this.idx ? 'cur' : ''}"></i>`; }).join('');
    $('.pct', this.el).textContent = Math.round(doneCount / n * 100) + '%';
    $('.stamp-tool', this.el).classList.toggle('glow', this.phase === 'stamp');

    const ml = $('.mat-letter', this.el); if (ml) ml.classList.toggle('ready', this.phase === 'file' || this.phase === 'fixing');
  },
  tip() {
    const L = this.cur; const b = $('.assistant .speech', this.el), m = $('.assistant .mascot', this.el);
    const T = {
      pick: `Surat ke-${this.idx + 1} sudah menunggu. <b>Klik surat teratas</b> di baki Surat Masuk untuk mengambil dan membacanya.`,
      read: 'Baca kop suratnya, lalu klik <b>nama pengirim</b>.',
      stamp: 'Bagus! Sekarang <b>seret stempel DITERIMA</b> ke atas surat di area kerja. Bisa juga dengan mengeklik stempelnya.',
      agenda: 'Cap sudah terpasang. <b>Klik Buku Agenda</b> untuk mencatat surat dan menentukan kata tangkapnya.',
      file: `Kode laci sudah tertulis. <b>Seret surat ke laci</b> yang sesuai. Kamu juga bisa klik surat, lalu klik lacinya.`,
      fixing: `Pindahkan surat ke <b>laci ${L ? L.laci : ''}</b> yang menyala hijau.`,
      done: 'Mantap! Surat tersimpan rapi.',
    };
    say(b, m, T[this.phase] || '');
  },
  help() {
    const L = this.cur;
    dialog({ title: 'Bantuan', width: 1200,
      body: `<ol style="font-size:26px;padding-left:34px;margin:0 0 14px">${GUIDE.map((g, i) => `<li style="margin-bottom:8px;${PHASE_STEP[this.phase] === i ? 'background:#FFF1C9;border-radius:8px;padding:2px 8px' : ''}"><b>${g.t}.</b> ${g.d}</li>`).join('')}</ol>
        <p style="font-size:24px;background:#EEF3F8;border-radius:14px;padding:14px 18px;margin:0"><b>Ingat aturan mengindeks:</b> PT, CV, dan UD ditulis di belakang. Nama orang diindeks dari nama terakhir tanpa gelar. Pemerintah daerah diindeks dari nama daerahnya.</p>`,
      buttons: [{ label: 'Kembali bekerja', value: 1, cls: 'btn-green', icon: 'check' }] });
  },
  async finish() {
    clearInterval(this.timer);
    const secs = Math.floor((Date.now() - this.t0) / 1000);
    const ok = this.stats.filter((s) => s.arsipOK).length;
    const acc = Math.round(ok / this.stats.length * 100);
    Store.set('labBest', Math.max(Store.get('labBest', 0), acc));
    if (acc >= CONFIG.targetAkurasi) Store.set('labDone', true);
    const res = { stats: this.stats, acc, ok, secs, date: new Date().toISOString() };
    Store.set('labLast', { acc, ok, total: this.stats.length, secs, date: res.date, proc: this.stats.reduce((a, s) => a + s.proc, 0),
      pengirim: this.stats.filter((s) => s.pengirimOK).length, indeks: this.stats.filter((s) => s.ktOK).length,
      errs: this.stats.filter((s) => !s.arsipOK).map((s) => ({ sender: s.sender, laci: s.laci, pilih: s.firstDrawer, kt: s.ktWord, ktOK: s.ktOK })) });
    await sleep(500);
    go('hasil', res);
  },
};

function predikatOf(acc) {
  if (acc >= 100) return ['Arsiparis Andal', 5];
  if (acc >= 80) return ['Arsiparis Muda', 4];
  if (acc >= 60) return ['Staf Magang', 3];
  if (acc >= 40) return ['Perlu Latihan', 2];
  return ['Ayo Coba Lagi', 1];
}
Scenes.hasil = {
  el: null,
  build() {
    this.el = el(`<section class="scene" id="hasil" aria-label="Evaluasi dan umpan balik">${plainBG()}
      <button class="hud-btn js-home" style="position:absolute;left:32px;top:28px;z-index:30">${icon('home')}<span>Beranda</span></button>${hudHTML()}
      <div class="result-board"><div class="result-paper"></div></div><div class="predikat"></div>
      <div class="result-actions"><button class="btn btn-light btn-sm js-print">${icon('print')}Cetak hasil</button><button class="btn btn-orange btn-lg js-retry">${icon('refresh')}COBA LAGI</button><button class="btn btn-green btn-lg js-done">${icon('check')}SELESAI</button></div>
      <div class="result-tip">Teruslah berlatih untuk mencapai akurasi 100%! Setiap percobaan memakai 5 surat baru.</div></section>`);
    $('.js-home', this.el).onclick = () => go('home');
    $('.js-retry', this.el).onclick = () => go('lab');
    $('.js-done', this.el).onclick = () => go('home', { slow: true });
    $('.js-print', this.el).onclick = () => printResult();
    this.el.querySelector('.js-retry').title = 'Ulangi simulasi dari awal';
    this.el.querySelector('.js-done').title = 'Kembali ke menu utama';
  },
  async enter(r) {
    Sound.setProfile('menu');
    const total = r.stats.length, bad = total - r.ok, acc = r.acc, target = CONFIG.targetAkurasi;
    const [pred, stars] = predikatOf(acc);
    const good = acc >= target;
    const C = 2 * Math.PI * 70;
    const errs = r.stats.filter((s) => !s.arsipOK);
    const proc = r.stats.reduce((a, s) => a + s.proc, 0);
    $('.result-paper', this.el).innerHTML = `<div class="result-ribbon">${icon('star')}Simulasi Selesai!</div>
      <div><h3>Ringkasan hasil${Store.get('nama') ? ` &nbsp;<span style="font-family:var(--f-body);font-size:22px;color:var(--muted)">${escHTML(Store.get('nama'))}</span>` : ''}</h3>
        <div class="sum-row"><span class="ic" style="background:var(--navy)">${icon('clip')}</span>Total surat<span class="v">${total}</span></div>
        <div class="sum-row"><span class="ic" style="background:var(--green)">${icon('check')}</span>Arsip tepat<span class="v" style="color:var(--green)">${r.ok}</span></div>
        <div class="sum-row"><span class="ic" style="background:var(--red)">${icon('x')}</span>Arsip keliru<span class="v" style="color:var(--red)">${bad}</span></div>
        <h3 style="margin-top:18px">Persentase akurasi</h3>
        <div class="acc"><svg class="donut" viewBox="0 0 170 170"><circle cx="85" cy="85" r="70" fill="none" stroke="#E3E8EE" stroke-width="22"/>
          <circle class="js-arc" cx="85" cy="85" r="70" fill="none" stroke="${good ? '#2F9A5E' : '#EE7B30'}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.34,1.2,.64,1)"/>
          <text x="85" y="100" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="46" fill="#1D3557">${acc}%</text></svg>
          <div class="acc-msg"><b>${acc === 100 ? 'Sempurna!' : good ? 'Kerja bagus!' : 'Belum mencapai target.'}</b>${good ? `Kamu sudah menguasai prosedur penanganan surat masuk dengan baik.` : `Target minimal ${target}%. Baca lagi aturan mengindeks, lalu coba dengan surat baru.`}</div></div>
        <div class="sub-stats"><div><b>${r.stats.filter((s) => s.pengirimOK).length}/${total}</b>Pengirim dikenali</div><div><b>${r.stats.filter((s) => s.ktOK).length}/${total}</b>Kata tangkap tepat</div><div><b>${proc}</b>Salah urutan prosedur</div><div><b>${fmtTime(r.secs)}</b>Waktu kerja</div></div></div>
      <div><h3>Grafik performa</h3>
        <div class="chart"><span class="yl" style="bottom:0">0%</span><span class="yl" style="bottom:50%">50%</span><span class="yl" style="bottom:100%">100%</span>
          <div class="tline" style="bottom:${target}%"><b>Target ${target}%</b></div>
          <div class="bar js-b1" style="background:${good ? 'var(--green)' : 'var(--orange)'}"><span>${acc}%</span><em>Akurasi kamu</em></div>
          <div class="bar js-b2" style="background:var(--navy-2)"><span>${target}%</span><em>Target minimal</em></div></div>
        <div class="errs"><h3 style="margin:0 0 10px">Detail kesalahan</h3>
          ${errs.length ? errs.map((s) => `<div class="err-item">Surat dari <b>${escHTML(s.sender)}</b>: seharusnya laci <b>${s.laci}</b>, kamu memilih laci <b>${s.firstDrawer}</b>.${s.ktOK ? '' : ` Kata tangkap yang dipilih: "${escHTML(s.ktWord)}".`}</div>`).join('')
            : `<div class="no-err">Tidak ada kesalahan peletakan. Semua surat tersimpan di laci yang tepat.</div>`}</div></div>`;
    $('.predikat', this.el).innerHTML = `<small>Predikat</small><div class="stars">${[1, 2, 3, 4, 5].map((i) => icon('star', i <= stars ? '' : 'off')).join('')}</div><b>${pred}</b>`;
    animateIn($('.predikat', this.el), 'pop-in', 700);
    setTimeout(() => {
      $('.js-arc', this.el).style.strokeDashoffset = C * (1 - acc / 100);
      $('.js-b1', this.el).style.height = Math.max(acc, 2) + '%'; $('.js-b2', this.el).style.height = target + '%';
      Sound.play(acc === 100 ? 'fanfare' : acc < target ? 'softWarn' : 'chime');
    }, 350);
  },
};

/* =========================================================
   EVALUASI AKHIR
   ========================================================= */
Scenes.evaluasi = {
  el: null, qs: [], i: 0, score: 0, res: [],
  build() {
    this.el = el(`<section class="scene" id="evaluasi" aria-label="Evaluasi akhir">${plainBG()}
      ${topbarHTML('Evaluasi Akhir', { badge: 'Petunjuk' })}<article class="sheet eval-card"></article></section>`);
    $('.js-back', this.el).onclick = async () => {
      if (this.i > 0 && this.i < this.qs.length) {
        const v = await dialog({ title: 'Tinggalkan evaluasi?', body: '<p>Jawaban yang sudah kamu isi tidak akan disimpan.</p>', width: 820,
          buttons: [{ label: 'Lanjutkan', value: false, cls: 'btn-light' }, { label: 'Tinggalkan', value: true, cls: 'btn-orange' }] });
        if (!v) return;
      }
      go('home');
    };
  },
  intro() {
    const card = $('.eval-card', this.el); $('.js-badge', this.el).textContent = 'Petunjuk';
    card.innerHTML = `<h2>Petunjuk Evaluasi Akhir</h2><ul>
      <li>Terdiri dari <b>10 soal pilihan ganda</b> yang diacak dari seluruh materi.</li><li>Setiap jawaban benar bernilai 10. Nilai lulus adalah <b>80</b>.</li>
      <li>Setiap soal hanya bisa dijawab satu kali, lalu penjelasannya langsung muncul.</li><li>Tidak ada batas waktu. Jika belum lulus, kamu boleh mengulang dengan soal acak baru.</li></ul>
      <div class="eval-ident"><div class="field"><label for="en">Nama lengkap</label><input id="en" maxlength="40" value="${escHTML(Store.get('nama', ''))}"></div>
      <div class="field"><label for="ek">Kelas</label><input id="ek" maxlength="20" placeholder="contoh: X MPLB 1" value="${escHTML(Store.get('kelas', ''))}"></div></div>
      <div class="eval-foot"><span class="hint-line">${icon('info')}Nama dan kelas akan tercetak di lembar hasil.</span><button class="btn btn-orange btn-lg js-go">${icon('play')}Mulai Evaluasi</button></div>`;
    $('.js-go', card).onclick = () => {
      const n = $('#en', card).value.trim(), k = $('#ek', card).value.trim();
      if (!n) { $('#en', card).style.borderColor = 'var(--red)'; $('#en', card).focus(); toast('Isi nama lengkap dulu.', 'warn'); return; }
      Store.set('nama', n); Store.set('kelas', k);
      this.qs = shuffle(FINAL_BANK).slice(0, 10).map((q) => { const order = shuffle(q.o.map((_, k2) => k2)); return { q: q.q, o: order.map((k2) => q.o[k2]), a: order.indexOf(q.a), why: q.why }; });
      this.i = 0; this.score = 0; this.res = []; this.question();
    };
  },
  question() {
    const card = $('.eval-card', this.el);
    if (this.i >= this.qs.length) return this.result();
    const q = this.qs[this.i]; Sound.play('paper');
    $('.js-badge', this.el).textContent = `Soal ${this.i + 1} dari ${this.qs.length}`;
    card.innerHTML = `<div class="q-progress">${this.qs.map((_, k) => `<i class="${k === this.i ? 'cur' : this.res[k] === true ? 'ok' : this.res[k] === false ? 'no' : ''}"></i>`).join('')}</div>
      <div class="quiz-q">${this.i + 1}. ${q.q}</div><div class="quiz-opts">${q.o.map((o, k) => `<button class="q-opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span>${o}</button>`).join('')}</div>
      <div class="q-fb"></div><div class="eval-foot"><span class="hint-line">${icon('target')}Nilai sementara: ${this.score * 10}</span><button class="btn btn-orange js-n" style="visibility:hidden">${this.i < this.qs.length - 1 ? 'Soal berikutnya' : 'Lihat nilai'}${icon('right')}</button></div>`;
    card.firstElementChild.nextElementSibling.animate([{ opacity: 0, transform: 'translateX(40px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
    $$('.q-opt', card).forEach((b) => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.a; this.res[this.i] = ok; if (ok) this.score++;
      $$('.q-opt', card).forEach((x) => { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add('good'); });
      if (!ok) b.classList.add('bad');
      Sound.play(ok ? 'success' : 'error');
      const fb = $('.q-fb', card); fb.className = 'q-fb show ' + (ok ? 'ok' : 'no'); fb.innerHTML = `<b>${ok ? 'Benar!' : 'Belum tepat.'}</b> ${q.why}`;
      const n = $('.js-n', card); n.style.visibility = 'visible'; n.focus();
      $('.hint-line', card).innerHTML = `${icon('target')}Nilai sementara: ${this.score * 10}`;
    });
    $('.js-n', card).onclick = () => { this.i++; this.question(); };
  },
  result() {
    const card = $('.eval-card', this.el); const nilai = this.score * 10, lulus = nilai >= 80;
    $('.js-badge', this.el).textContent = 'Hasil';
    Store.set('evalBest', Math.max(Store.get('evalBest', 0), nilai)); if (lulus) Store.set('evalPassed', true);
    Store.set('evalLast', { nilai, benar: this.score, total: this.qs.length, lulus, date: new Date().toISOString() });
    Sound.play(lulus ? 'fanfare' : 'softWarn');
    card.innerHTML = `<h2>Hasil Evaluasi Akhir</h2><div class="eval-score" style="margin-top:30px"><div class="big-score" style="color:${lulus ? 'var(--green)' : 'var(--red)'}"><div><b>${nilai}</b><small style="color:var(--navy)">dari 100</small></div></div>
      <div><p style="font-family:var(--f-head);font-weight:800;font-size:48px;margin:0;line-height:1.05">${lulus ? 'Selamat, kamu lulus!' : 'Belum mencapai nilai lulus'}</p>
        <p style="font-size:28px;margin:12px 0">${escHTML(Store.get('nama', ''))}${Store.get('kelas') ? ', ' + escHTML(Store.get('kelas')) : ''}</p>
        <p style="font-size:26px;margin:0">Jawaban benar <b>${this.score} dari ${this.qs.length}</b>. ${lulus ? 'Kamu memahami dasar prosedur penanganan dokumen dan sistem abjad.' : 'Pelajari kembali materi, terutama bagian yang kamu jawab keliru, lalu coba lagi.'}</p>
        <div class="q-progress" style="margin-top:24px;max-width:700px">${this.res.map((r) => `<i class="${r ? 'ok' : 'no'}"></i>`).join('')}</div></div></div>
      <div class="eval-foot"><button class="btn btn-light js-print">${icon('print')}Cetak hasil</button><div style="display:flex;gap:24px">
        ${lulus ? '' : `<button class="btn btn-light js-materi">${icon('book')}Buka Materi</button>`}<button class="btn btn-orange js-again">${icon('refresh')}Ulangi</button><button class="btn btn-green js-home">${icon('home')}Beranda</button></div></div>`;
    $('.js-print', card).onclick = () => printResult();
    $('.js-again', card).onclick = () => this.intro();
    $('.js-home', card).onclick = () => go('home');
    const jm = $('.js-materi', card); if (jm) jm.onclick = () => go('materi');
  },
  async enter() { Sound.setProfile('menu'); this.i = 0; this.qs = []; this.intro(); },
};

      <div>Program keahlian</div><div>${CONFIG.programKeahlian}</div><div>Sasaran pengguna</div><div>${CONFIG.sasaran}</div>
      <div>Cakupan materi</div><div>Dasar prosedur penanganan dokumen: siklus hidup dokumen, jenis dan fungsi dokumen, serta proses penerimaan hingga pemusnahan dokumen</div></div>
      <div class="flowmap"><span>Beranda</span><i>${icon('right')}</i><span>Studi Kasus</span><i>${icon('right')}</i><span>Materi</span><i>${icon('right')}</i><span>Panduan</span><i>${icon('right')}</i><span>Lab Simulasi</span><i>${icon('right')}</i><span>Umpan Balik</span><i>${icon('right')}</i><span>Evaluasi Akhir</span></div>`;

      <li>Menerapkan prosedur penanganan surat masuk: membaca kop surat, membubuhkan cap DITERIMA, dan mencatat di buku agenda.</li>
      <li>Menyimpan surat masuk dengan sistem abjad sesuai peraturan mengindeks, dengan akurasi minimal ${CONFIG.targetAkurasi}%.</li></ol>`;
    if (this.tab === 2) c.innerHTML = `<h2>Petunjuk untuk guru</h2><ol>
      <li>Cocok dipakai dengan model <b>Flipped Classroom</b> atau <b>Project-Based Learning</b>. Jelaskan konsep teori di kelas, lalu minta siswa berlatih di Lab Maya.</li>
      <li>Siswa cukup membuka file <b>index.html</b> di browser (Chrome, Edge, atau Firefox). Tidak perlu koneksi internet.</li>
      <li>Targetkan akurasi pengarsipan minimal <b>${CONFIG.targetAkurasi}%</b>. Setiap percobaan memakai 5 surat acak dari ${LETTERS.length} surat, sehingga siswa tidak bisa sekadar menghafal.</li>
      <li>Lembar hasil lab dan evaluasi bisa dicetak atau disimpan sebagai PDF lewat tombol <b>Cetak hasil</b>.</li>
      <li>Progres tersimpan di browser masing-masing perangkat. Gunakan tombol di bawah untuk menghapusnya sebelum dipakai siswa lain.</li></ol>
      <div style="margin-top:24px"><button class="btn btn-light btn-sm js-reset">${icon('refresh')}Hapus progres di perangkat ini</button></div>`;
    if (this.tab === 3) c.innerHTML = `<h2>Pengembang dan kredit</h2><div class="kv">${CONFIG.pengembang.map((p) => `<div>${escHTML(p.peran)}</div><div>${escHTML(p.nama)}</div>`).join('')}

      <div>Musik dan efek suara</div><div>Disintesis langsung di browser dengan Web Audio API</div><div>Huruf</div><div>Baloo 2, Plus Jakarta Sans, dan Caveat (SIL Open Font License)</div></div>`;
    const rs = $('.js-reset', c);
    if (rs) rs.onclick = async () => {
      const v = await dialog({ title: 'Hapus progres?', body: '<p>Nama, kelas, dan semua nilai di perangkat ini akan dihapus.</p>', width: 820, buttons: [{ label: 'Batal', value: false, cls: 'btn-light' }, { label: 'Hapus', value: true, cls: 'btn-orange' }] });
      if (v) { Store.reset(); toast('Progres di perangkat ini sudah dihapus.', 'ok'); }

/* =========================================================
   CETAK HASIL
   ========================================================= */
function printResult() {
  const lab = Store.get('labLast'), ev = Store.get('evalLast');
  const d = (iso) => iso ? fmtTanggal(new Date(iso)) : '-';
  $('#print-sheet').innerHTML = `<h1>Lembar Hasil Lab Maya</h1><div>${CONFIG.judul} &nbsp;|&nbsp; ${CONFIG.programKeahlian}</div>
    <table><tr><th style="width:30%">Nama</th><td>${escHTML(Store.get('nama', '-'))}</td></tr><tr><th>Kelas</th><td>${escHTML(Store.get('kelas', '-'))}</td></tr><tr><th>Dicetak</th><td>${fmtTanggal(new Date())}</td></tr></table>
    <h3>Lab Simulasi (percobaan terakhir, ${d(lab && lab.date)})</h3>
    ${lab ? `<table><tr><th>Total surat</th><th>Arsip tepat</th><th>Akurasi</th><th>Pengirim dikenali</th><th>Kata tangkap tepat</th><th>Salah urutan</th><th>Waktu</th></tr>
      <tr><td>${lab.total}</td><td>${lab.ok}</td><td>${lab.acc}% (target ${CONFIG.targetAkurasi}%)</td><td>${lab.pengirim}</td><td>${lab.indeks}</td><td>${lab.proc}</td><td>${fmtTime(lab.secs)}</td></tr></table>
      ${lab.errs.length ? `<table><tr><th>Surat keliru</th><th>Laci benar</th><th>Laci dipilih</th></tr>${lab.errs.map((e) => `<tr><td>${escHTML(e.sender)}</td><td>${e.laci}</td><td>${e.pilih}</td></tr>`).join('')}</table>` : ''}
      <div>Akurasi terbaik: ${Store.get('labBest', '-')}% &nbsp;|&nbsp; Predikat: ${predikatOf(lab.acc)[0]}</div>` : '<p>Belum ada percobaan.</p>'}
    <h3>Evaluasi Akhir (${d(ev && ev.date)})</h3>
    ${ev ? `<table><tr><th>Benar</th><th>Nilai</th><th>Status</th><th>Nilai terbaik</th></tr><tr><td>${ev.benar} dari ${ev.total}</td><td>${ev.nilai}</td><td>${ev.lulus ? 'Lulus' : 'Belum lulus'} (KKM 80)</td><td>${Store.get('evalBest', '-')}</td></tr></table>` : '<p>Belum dikerjakan.</p>'}
    <p style="margin-top:30pt">Paraf guru: ____________________</p>`;
  window.print();
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  Store.load(); Sound.musicOnInitial = Store.get('musicOn', true);
  stage = $('#stage'); fit(); addEventListener('resize', fit);
  Object.values(Scenes).forEach((S) => { S.build(); stage.insertBefore(S.el, $('#modal-back')); });
  stage.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.classList.contains('js-music')) { Sound.setMusic(!Sound.musicOn); Store.set('musicOn', Sound.musicOn); refreshMusicIcons(); }
    if (b.classList.contains('js-full')) toggleFull();
    if (!b.closest('.drawer, .chip, .q-opt, .cyc-node, .flow-node, .flip, .tray-card, .hot')) Sound.play('click');
  });
  stage.addEventListener('mouseover', (e) => { const b = e.target.closest('.btn, .folder, .hud-btn'); if (b && !b.contains(e.relatedTarget)) Sound.play('hover'); });
  $('#modal-back').addEventListener('click', (e) => { if (e.target.id === 'modal-back' && modalCloseable) closeModal(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalCloseable) closeModal(); });
  $('#rotate button').onclick = () => document.body.classList.add('force');
  updateClocks(); setInterval(updateClocks, 30000);
  go('splash');
}
document.addEventListener('DOMContentLoaded', init);

</script>
